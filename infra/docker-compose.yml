# ======================================================================================
# DeepSearchStack — Full Stack
# Standalone — inference-gateway runs as a compose service
# ======================================================================================

volumes:
  postgres_data:
  yacy_data:
  redis_data:
  vector_data:
  warehouse_data:
  crawler_cache:
  web_api_data:

networks:
  deepsearch_net:
    driver: bridge
    name: deepsearch_net

services:
  # --- REVERSE PROXY (single entrypoint) ---
  nginx:
    image: nginx:alpine
    container_name: dss-nginx
    restart: unless-stopped
    ports:
      - "${DSS_PORT:-8083}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - deepsearch_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - web-api
      - crawler
      - knowledge-warehouse
      - vector-store
      - search-agent
      - search-gateway

  # --- CORE INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    container_name: dss-postgres
    restart: unless-stopped
    networks:
      - deepsearch_net
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-searchdb}
      - POSTGRES_USER=${POSTGRES_USER:-searchuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-searchpass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dss-redis
    restart: unless-stopped
    networks:
      - deepsearch_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CORE LOGIC ---
  search-gateway:
    build:
      context: ..
      dockerfile: services/search-gateway/Dockerfile
    container_name: dss-search-gateway
    restart: unless-stopped
    networks:
      - deepsearch_net
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - YACY_URL=http://yacy:8090
      - SEARXNG_URL=http://searxng:8080
      - REDIS_URL=redis://redis:6379/0

  # --- SEARCH BACKENDS ---
  yacy:
    image: yacy/yacy_search_server:latest
    container_name: dss-yacy
    restart: unless-stopped
    networks:
      - deepsearch_net
    volumes:
      - yacy_data:/opt/yacy_search_server/DATA
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/yacysearch.json?query=test&maximumRecords=1"]
      interval: 30s
      timeout: 15s
      retries: 30
      start_period: 180s

  searxng:
    image: searxng/searxng:latest
    container_name: dss-searxng
    restart: unless-stopped
    networks:
      - deepsearch_net
    volumes:
      - ../services/searxng/settings.yml:/etc/searxng/settings.yml
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]

  # --- DATA SERVICES ---
  vector-store:
    build:
      context: ..
      dockerfile: services/vector-store/Dockerfile
    container_name: dss-vector-store
    restart: unless-stopped
    networks:
      - deepsearch_net
    volumes:
      - vector_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  crawler:
    build:
      context: ..
      dockerfile: services/crawler/Dockerfile
    container_name: dss-crawler
    restart: unless-stopped
    networks:
      - deepsearch_net
    environment:
      - PORT=8000
      - KNOWLEDGE_WAREHOUSE_URL=http://knowledge-warehouse:8009
      - FORWARD_TO_WAREHOUSE=true
      - CRAWLER_CONCURRENCY=10
      - HTTP_PROXY=${CRAWLER_HTTP_PROXY:-}
      - HTTPS_PROXY=${CRAWLER_HTTPS_PROXY:-}
    volumes:
      - crawler_cache:/app/cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  knowledge-warehouse:
    build:
      context: ..
      dockerfile: services/knowledge-warehouse/Dockerfile
    container_name: dss-knowledge-warehouse
    restart: unless-stopped
    networks:
      - deepsearch_net
    environment:
      - PORT=8009
    volumes:
      - warehouse_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --- AI SERVICES ---
  search-agent:
    build:
      context: ..
      dockerfile: services/search-agent/Dockerfile
    container_name: dss-search-agent
    restart: unless-stopped
    networks:
      - deepsearch_net
    depends_on:
      inference-gateway:
        condition: service_started
      search-gateway:
        condition: service_started
    environment:
      - LLM_GATEWAY_URL=http://inference-gateway:8005
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-api:
    build:
      context: ..
      dockerfile: services/web-api/Dockerfile
    container_name: dss-web-api
    restart: unless-stopped
    networks:
      - deepsearch_net
    depends_on:
      search-gateway:
        condition: service_started
      search-agent:
        condition: service_healthy
    environment:
      - SEARCH_AGENT_URL=http://search-agent:8013
      - INFERENCE_GATEWAY_URL=http://inference-gateway:8005
      - SEARCH_GATEWAY_URL=http://search-gateway:8002
      - WAREHOUSE_URL=http://knowledge-warehouse:8009
      - CRAWLER_URL=http://crawler:8000
      - VECTOR_STORE_URL=http://vector-store:8004
      - REDIS_URL=redis://redis:6379/0
      - AGGREGATE_PROVIDERS=${AGGREGATE_PROVIDERS:-}
      - HASH_DB_PATH=/app/data/embed_hashes.json
    volumes:
      - web_api_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8014/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- AI INFERENCE ---
  inference-gateway:
    build:
      context: ..
      dockerfile: services/inference-gateway/Dockerfile
    container_name: dss-inference-gateway
    restart: unless-stopped
    networks:
      - deepsearch_net
    environment:
      - INFERENCE_GATEWAY_PORT=8005
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../services/inference-gateway/config:/app/config:ro
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- PROXY (optional, enable with --profile with-proxy) ---
  proxy-rotator:
    profiles: ["with-proxy"]
    build:
      context: ..
      dockerfile: services/proxy-rotator/Dockerfile
    container_name: dss-proxy-rotator
    restart: unless-stopped
    networks:
      - deepsearch_net
    environment:
      - POOL_FILE=/app/volumes/data/proxy-pool.json
    volumes:
      - ../services/proxy-rotator/volumes/data:/app/volumes/data
      - ../services/proxy-rotator/volumes/tor-data:/tmp/tor
    ports:
      - "${PROXY_ROTATOR_PORT:-8030}:8030"

  tinyproxy:
    profiles: ["with-proxy"]
    build:
      context: ../services/proxy-rotator/tinyproxy
      dockerfile: Dockerfile
    container_name: dss-tinyproxy
    restart: unless-stopped
    networks:
      - deepsearch_net
    ports:
      - "${TINYPROXY_PORT:-8888}:8888"
