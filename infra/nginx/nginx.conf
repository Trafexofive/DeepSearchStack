# DSS Reverse Proxy — single entrypoint for all DeepSearchStack services.
#
# Dynamic upstream resolution: each location uses a `set` variable in
# proxy_pass so nginx re-resolves the upstream hostname on every request
# (with Docker's embedded DNS at 127.0.0.11, ttl=5s). Without this, nginx
# caches the IP at startup — when a service container recreates, every
# subsequent request 502s until nginx restarts. With this, restarts heal
# in <=5 seconds.
#
# Note: when proxy_pass uses a variable, nginx does NOT do URI rewriting
# automatically. We replicate the original "strip the /dss/<svc>/ prefix"
# behavior by passing $1 (the captured trailing path) explicitly.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Default proxy headers for all upstreams (DRY).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    server {
        listen 80;

        # ── DSS Service Proxies ──────────────────────────────────────────
        # Pattern: capture the trailing path via regex location, set the
        # upstream as a variable (forces DNS re-resolution per request),
        # proxy_pass with explicit trailing $1.

        # web-api exposes /api/* AND a root /health. The regex below adds
        # the /api/ prefix for normal calls; the exact match below it maps
        # /dss/api/health → root /health for health-probe ergonomics.
        location = /dss/api/health {
            set $upstream "http://web-api:8014";
            proxy_pass $upstream/health;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location ~ ^/dss/api/(.*)$ {
            set $upstream "http://web-api:8014";
            proxy_pass $upstream/api/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/dss/search/(.*)$ {
            set $upstream "http://search-agent:8013";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/dss/crawl/(.*)$ {
            set $upstream "http://crawler:8000";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 240s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 240s;
            client_max_body_size 50m;
        }

        location ~ ^/dss/warehouse/(.*)$ {
            set $upstream "http://knowledge-warehouse:8009";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/dss/vectors/(.*)$ {
            set $upstream "http://vector-store:8004";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/dss/agent/(.*)$ {
            set $upstream "http://search-agent:8013";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            # SSE / streaming responses
            proxy_buffering off;
        }

        location ~ ^/dss/gateway/(.*)$ {
            set $upstream "http://search-gateway:8002";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
        }

        location ~ ^/dss/render/(.*)$ {
            set $upstream "http://browser-renderer:8015";
            proxy_pass $upstream/$1$is_args$args;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            client_max_body_size 20m;
        }

        # ── Healthcheck ──────────────────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","proxy":"dss-nginx","resolver":"dynamic"}';
            add_header Content-Type application/json;
        }
    }
}
