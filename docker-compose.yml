# DeepSearchStack — Root Compose (convenience, delegates to infra/)
# Standalone — inference-gateway runs as a compose service

volumes:
  postgres_data:
  redis_data:
  vector_data:
  warehouse_data:

networks:
  deepsearch_net:
    driver: bridge
    name: deepsearch_net

services:
  postgres:
    image: postgres:15-alpine
    container_name: dss-postgres
    restart: unless-stopped
    networks: [deepsearch_net]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-searchdb}
      - POSTGRES_USER=${POSTGRES_USER:-searchuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-searchpass}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dss-redis
    restart: unless-stopped
    networks: [deepsearch_net]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  search-gateway:
    build:
      context: .
      dockerfile: services/search-gateway/Dockerfile
    container_name: dss-search-gateway
    restart: unless-stopped
    networks: [deepsearch_net]
    depends_on:
      redis: {condition: service_healthy}
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8002:8002"

  deepsearch:
    build:
      context: .
      dockerfile: services/deepsearch/Dockerfile
    container_name: dss-deepsearch
    restart: unless-stopped
    networks: [deepsearch_net]
    depends_on:
      search-gateway: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      - SEARCH_GATEWAY_URL=http://search-gateway:8002
      - INFERENCE_GATEWAY_URL=http://inference-gateway:8005
      - VECTOR_STORE_URL=http://vector-store:8004
      - CRAWLER_URL=http://crawler:8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://searchuser:searchpass@postgres:5432/searchdb
    ports:
      - "8001:8001"

  vector-store:
    build:
      context: .
      dockerfile: services/vector-store/Dockerfile
    container_name: dss-vector-store
    restart: unless-stopped
    networks: [deepsearch_net]
    volumes: [vector_data:/app/data]
    ports:
      - "8004:8004"

  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile
    container_name: dss-crawler
    restart: unless-stopped
    networks: [deepsearch_net]
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  inference-gateway:
    build:
      context: .
      dockerfile: services/inference-gateway/Dockerfile
    container_name: dss-inference-gateway
    restart: unless-stopped
    networks: [deepsearch_net]
    environment:
      - INFERENCE_GATEWAY_PORT=8005
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./services/inference-gateway/config:/app/config:ro
    ports:
      - "8005:8005"

  wiki-indexer:
    build:
      context: .
      dockerfile: services/wiki-indexer/Dockerfile
    container_name: dss-wiki-indexer
    restart: "no"
    networks: [deepsearch_net]
    volumes:
      - ./services/wiki-indexer/volumes/data:/app/data
      - ./services/wiki-indexer/volumes/output:/app/output
    environment:
      - WIKI_DUMP_PATH=/app/data/enwiki-latest-pages-articles.xml.bz2
      - WIKI_DUMP_URL=https://dumps.wikimedia.org/enwiki/latest/enwiki-latest-pages-articles.xml.bz2
      - WAREHOUSE_URL=http://knowledge-warehouse:8009
      - VECTOR_STORE_URL=http://vector-store:8004
    ports:
      - "${WIKI_INDEXER_PORT:-8014}:8014"

  knowledge-warehouse:
    build:
      context: .
      dockerfile: services/knowledge-warehouse/Dockerfile
    container_name: dss-knowledge-warehouse
    restart: unless-stopped
    networks: [deepsearch_net]
    environment:
      - PORT=8009
    volumes:
      - warehouse_data:/app/data
    ports:
      - "8009:8009"
